<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <title>Checkout Form</title>
</head>
<body>

    <h1>Checkout Form</h1>
        <p>Complete your purchase</p>

     <form action="#" method="get" onsubmit="event.preventDefault(); alert('Order placed successfully!');">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" autocomplete="name" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required autocomplete="tel" pattern="[+0-9 ]{10,15}"
                placeholder="+234 7056934882" title="Enter 10 to 15 digits only">
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" autocomplete="email" required placeholder="e.g example@gmail.com">
            <br><br>

        </fieldset>
        <fieldset>
            <legend>Shipping Address</legend>
            <label for="address">Street Address:</label>
            <input type="text" id="address" name="address" autocomplete="address-line1" placeholder="e.g 12 Allen Avenue" required>
            <br><br>
            
            <label for="city">City:</label>
            <input type="text" id="city" name="city" autocomplete="address-level2" required>
            <br><br>

            <label for="country">Country:</label>
            <select id="country" name="country" autocomplete="country-name" required>
                <option value="">--Select Country--</option>
                <option value="Nigeria">Nigeria</option>
                <option value="Ghana">Ghana</option>
                <option value="Kenya">Kenya</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="United states">United States</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Payment Details</legend>
            <label for="cardnumber">Card Number:</label>
            <input type="text" id="cardnumber" name="cardnumber" autocomplete="cc-number"  pattern="[0-9]{16}" placeholder="1234123412341234" title="Card number must be 16 digits" required>
            <br><br>

            <label for="expiry">Expiry Date:</label>
            <input type="text" id="expiry" name="expiry" autocomplete="cc-exp" pattern="[0-9]{2}/[0-9]{2}" placeholder="MM/YY" title="Use MM/YY format" required>
            <br><br>

            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" name="cvv" autocomplete="cc-csc" pattern="[0-9]{3}" placeholder="123" title="CVV must be 3 digits" required>
            <br><br>
        </fieldset>

        <label for="terms">
            <input type="checkbox" id="terms" name="terms" required> I agree to terms and conditions
        </label>

        <button type="submit">Place Order</button>
    </form>
 </body>
</html>
